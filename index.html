<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>KCC 현장 실측 · 평면도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF1F5; --panel:#FFFFFF; --ink:#141821; --muted:#6B7686;
    --line:#D7DDE6; --grid:#E1E5EC; --grid-strong:#CFD6E0;
    --wall:#232C3A; --wall-fill:#FBFCFE; --inner:#4A5568;
    --measured:#0E7C66; --unmeasured:#C2410C;
    --sel:#1D6FE0; --accent:#E1251B;
    --dim:#5A6472; --dim-line:#9AA4B2;
    --shadow:0 10px 34px rgba(20,30,50,.16);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
  html,body{height:100%;margin:0;}
  body{font-family:"Space Grotesk",system-ui,sans-serif;color:var(--ink);background:var(--bg);
    overflow:hidden;touch-action:none;display:flex;flex-direction:column;}
  .mono{font-family:"IBM Plex Mono",monospace;}

  header{height:54px;flex:0 0 54px;background:var(--panel);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:7px;padding:0 12px;z-index:40;overflow-x:auto;}
  .brand{display:flex;align-items:center;gap:9px;margin-right:4px;flex:0 0 auto;}
  .brand .dot{width:9px;height:9px;border-radius:2px;background:var(--accent);}
  .brand b{font-weight:700;font-size:15px;letter-spacing:-.2px;white-space:nowrap;}
  .brand span{font-size:11px;color:var(--muted);font-weight:500;white-space:nowrap;}
  .spacer{flex:1 0 8px;}
  .btn{height:38px;padding:0 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel);
    color:var(--ink);font-family:inherit;font-weight:600;font-size:13px;white-space:nowrap;
    display:inline-flex;align-items:center;gap:6px;cursor:pointer;flex:0 0 auto;}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);}
  .btn.go{background:var(--sel);color:#fff;border-color:var(--sel);}
  .btn.on{background:#E7F6EE;border-color:#A6E4C8;color:#0E7A50;}
  .btn.warn{color:var(--accent);border-color:#F0CBC8;}
  .btn.icon{width:38px;padding:0;justify-content:center;font-size:17px;}
  .btn:disabled{opacity:.4;pointer-events:none;}

  .stage{flex:1;position:relative;min-height:0;}
  svg#plan{width:100%;height:100%;display:block;background:var(--bg);touch-action:none;}
  @keyframes blink{0%,100%{opacity:.9}50%{opacity:.15}}
  .blink{animation:blink 1s ease-in-out infinite;}

  .hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);
    background:rgba(20,24,33,.92);color:#fff;padding:8px 15px;border-radius:22px;
    font-size:12.5px;font-weight:600;pointer-events:none;z-index:20;white-space:nowrap;box-shadow:var(--shadow);}
  .hint b{color:#89B4FF;}

  .scalebar{position:absolute;left:14px;top:14px;z-index:20;background:rgba(255,255,255,.9);
    border:1px solid var(--line);border-radius:8px;padding:6px 9px;display:flex;align-items:center;gap:8px;
    box-shadow:0 2px 8px rgba(20,30,50,.08);}
  .scalebar .bar{height:8px;border-left:2px solid var(--ink);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);}
  .scalebar span{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;color:var(--ink);}

  .zoombar{position:absolute;right:14px;bottom:calc(14px + var(--dimh,0px));display:flex;flex-direction:column;
    gap:7px;z-index:20;transition:bottom .2s;}
  .zoombar .btn{width:44px;height:44px;justify-content:center;font-size:20px;box-shadow:var(--shadow);}

  /* 선택 바 */
  .selbar{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);
    box-shadow:0 -8px 26px rgba(20,30,50,.10);z-index:30;padding:11px 14px calc(11px + env(safe-area-inset-bottom));
    transform:translateY(120%);transition:transform .24s cubic-bezier(.4,0,.2,1);
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .selbar.open{transform:translateY(0);}
  .selbar .lab{font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px;}
  .selbar .lab .sq{width:15px;height:15px;border-radius:3px;background:var(--sel);}
  .selbar .dimbtn{height:48px;padding:0 16px;border-radius:12px;border:1.5px solid var(--sel);background:#EEF4FF;
    color:#1B4ED8;font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:20px;cursor:pointer;display:flex;align-items:center;gap:6px;}
  .selbar .dimbtn small{font-size:12px;color:var(--muted);font-weight:600;}
  .th{display:flex;align-items:center;gap:8px;background:#F4F6F9;border:1px solid var(--line);border-radius:12px;padding:5px 8px;}
  .th .t{font-size:11px;font-weight:700;color:var(--muted);}
  .th button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:18px;font-weight:700;cursor:pointer;color:var(--ink);}
  .th .v{font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:16px;min-width:42px;text-align:center;}
  .selbar .grow{flex:1 0 8px;}

  /* 숫자패드 */
  .numpad{position:absolute;left:50%;bottom:16px;transform:translate(-50%,140%);width:280px;max-width:calc(100vw - 24px);
    background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);z-index:50;
    padding:12px;transition:transform .22s cubic-bezier(.4,0,.2,1);}
  .numpad.open{transform:translate(-50%,0);}
  .np-head{font-size:12px;font-weight:700;color:var(--muted);margin:2px 2px 8px;display:flex;justify-content:space-between;align-items:center;}
  .np-val{font-family:"IBM Plex Mono",monospace;font-size:30px;font-weight:600;text-align:right;padding:6px 12px;
    background:#F1F4F9;border-radius:10px;margin-bottom:10px;min-height:48px;}
  .np-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .np-grid button{height:52px;border-radius:12px;border:1px solid var(--line);background:#fff;
    font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:600;cursor:pointer;color:var(--ink);}
  .np-grid button:active{background:#EEF2F7;}
  .np-grid .ok{background:var(--sel);color:#fff;border-color:var(--sel);}
  .np-grid .del{background:#FFF3F2;color:var(--accent);border-color:#F0CBC8;font-size:18px;}

  .laser-pop{position:absolute;top:60px;right:12px;width:320px;max-width:calc(100vw - 24px);
    background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);z-index:60;padding:14px;display:none;}
  .laser-pop.open{display:block;}
  .laser-pop h4{margin:0 0 8px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px;}
  .laser-pop .st{font-size:12px;font-weight:600;margin-bottom:10px;}
  .st.off{color:var(--muted);} .st.on{color:var(--measured);} .st.err{color:var(--accent);}
  .laser-pop .val{font-family:"IBM Plex Mono",monospace;font-size:28px;font-weight:600;text-align:center;padding:10px;background:#F1F4F9;border-radius:10px;margin:10px 0;}
  .laser-pop .val small{font-size:14px;color:var(--muted);}
  .laser-pop .log{font-family:"IBM Plex Mono",monospace;font-size:9.5px;background:#0E1116;color:#8FE3B0;border-radius:8px;padding:8px;height:64px;overflow-y:auto;white-space:pre-wrap;line-height:1.45;margin-top:8px;}
  .switch{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;}
  .switch input{width:40px;height:22px;}
  ::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:#C3CBD6;border-radius:8px;}
</style>
</head>
<body>

<header>
  <div class="brand"><span class="dot"></span><b>KCC 실측</b><span>· 평면도</span></div>
  <button class="btn primary" id="btnSketch">✎ 손으로 그리기</button>
  <button class="btn go" id="btnConvert" disabled>→ 도면 변환</button>
  <button class="btn on" id="btnOrtho">⊾ 직각보정 30°</button>
  <div class="spacer"></div>
  <button class="btn" id="btnLaser">📡 레이저</button>
  <button class="btn" id="btnExport">DXF</button>
  <button class="btn warn icon" id="btnUndo" title="되돌리기">↶</button>
  <button class="btn warn" id="btnClear">지우기</button>
</header>

<div class="stage">
  <svg id="plan" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="hint" id="hint"></div>
  <div class="scalebar"><div class="bar" id="scaleLine"></div><span id="scaleLabel">1000mm</span></div>
  <div class="zoombar">
    <button class="btn icon" id="zIn">＋</button>
    <button class="btn icon" id="zOut">－</button>
    <button class="btn icon" id="zFit" title="화면 맞춤">⤢</button>
  </div>

  <!-- 선택 바 -->
  <div class="selbar" id="selbar">
    <div class="lab"><span class="sq"></span><span id="sbName">벽</span></div>
    <button class="dimbtn" id="sbDim"><span id="sbDimVal">—</span><small>mm</small></button>
    <div class="th"><span class="t">벽두께</span><button id="thMinus">−</button><span class="v" id="thVal">180</span><button id="thPlus">＋</button></div>
    <div class="grow"></div>
    <button class="btn on" id="sbLaser">📡 레이저</button>
    <button class="btn icon" id="sbClose">✕</button>
  </div>

  <!-- 숫자패드 -->
  <div class="numpad" id="numpad">
    <div class="np-head"><span id="npHead">치수 입력</span><span class="mono" style="color:var(--muted)">mm</span></div>
    <div class="np-val" id="npVal">0</div>
    <div class="np-grid" id="npGrid"></div>
  </div>

  <div class="laser-pop" id="laserPop"></div>
</div>

<script>
/* =========================================================================
   KCC 평면도 v3 — 손보정 · 벽두께 · 캐드식 치수
   ========================================================================= */
const svg=document.getElementById('plan');
const NS='http://www.w3.org/2000/svg';
const GRID=40, PX_PER_MM=0.06;
let vb={x:0,y:0,w:1600,h:1000};

const DEF_TH_OUT=180, DEF_TH_IN=100;   // 기본 벽두께(mm)
const SNAP_DEG=30;                     // 이 각도 이내면 직각으로 스냅

const S={
  mode:'sketch', ortho:true,
  strokes:[], cur:null,
  outline:[], outlineMM:[], outlineTh:[],
  interiors:[],                        // {pts, mm[], th[]}
  sel:null,
};
let history=[];
function pushHist(){ history.push(JSON.stringify({o:S.outline,om:S.outlineMM,ot:S.outlineTh,in:S.interiors}));
  if(history.length>60)history.shift(); }
function undo(){ if(!history.length){ flash('되돌릴 게 없어요'); return; }
  const h=JSON.parse(history.pop());
  S.outline=h.o; S.outlineMM=h.om; S.outlineTh=h.ot||S.outline.map(()=>DEF_TH_OUT); S.interiors=h.in;
  S.sel=null; closeSel(); closeNumpad();
  if(!S.outline.length && !S.interiors.length && !S.strokes.length) setMode('sketch'); else render(); }

/* ---------- 기하 ---------- */
function toSvg(cx,cy){ const p=svg.createSVGPoint();p.x=cx;p.y=cy;
  const q=p.matrixTransform(svg.getScreenCTM().inverse());return {x:q.x,y:q.y}; }
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function unit(a,b){ const dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1;return {x:dx/l,y:dy/l}; }
function perp(a,b){ const d=unit(a,b);return {x:-d.y,y:d.x}; }
function apply(){ svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }
function el(t,a={},p){ const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e; }
function centroid(pts){ let x=0,y=0;pts.forEach(p=>{x+=p.x;y+=p.y;});return {x:x/pts.length,y:y/pts.length}; }
function distToSeg(p,a,b){ const dx=b.x-a.x,dy=b.y-a.y,L2=dx*dx+dy*dy||1;
  let t=((p.x-a.x)*dx+(p.y-a.y)*dy)/L2;t=Math.max(0,Math.min(1,t));
  const pr={x:a.x+t*dx,y:a.y+t*dy};return {d:dist(p,pr),t,proj:pr}; }
const svPerPx=()=>vb.w/svg.clientWidth;

/* =========================================================================
   렌더링
   ========================================================================= */
function render(){
  apply(); svg.innerHTML=''; drawGrid();

  if(S.mode==='edit'){
    const c=S.outline.length?centroid(S.outline):{x:0,y:0};
    // 벽체 (두께 2선 = 채운 밴드)
    for(let i=0;i<S.outline.length;i++) drawWallBand(S.outline[i],S.outline[(i+1)%S.outline.length],S.outlineTh[i],'var(--wall)');
    S.interiors.forEach(w=>{ for(let j=0;j<w.pts.length-1;j++) drawWallBand(w.pts[j],w.pts[j+1],w.th[j],'var(--inner)'); });

    // 선택 하이라이트(깜빡)
    if(S.sel){ const s=selSeg(S.sel); if(s){ const h=el('line',{x1:s.a.x,y1:s.a.y,x2:s.b.x,y2:s.b.y,
      stroke:'var(--sel)','stroke-width':Math.max(6,thOf(S.sel)*PX_PER_MM),'stroke-linecap':'butt'},svg); h.classList.add('blink'); } }

    // 치수 (보조선 + 중앙 박스)
    for(let i=0;i<S.outline.length;i++) drawDim(S.outline[i],S.outline[(i+1)%S.outline.length],S.outlineMM[i],c,{t:'o',w:i},34);
    S.interiors.forEach((w,s)=>{ for(let j=0;j<w.pts.length-1;j++) drawDim(w.pts[j],w.pts[j+1],w.mm[j],c,{t:'in',s,w:j},22); });

    // 정점
    S.outline.forEach(v=>el('rect',{x:v.x-5,y:v.y-5,width:10,height:10,fill:'#fff',stroke:'var(--wall)','stroke-width':2},svg));
    S.interiors.forEach(w=>w.pts.forEach((v,idx)=>{ const end=idx===0||idx===w.pts.length-1;
      el('circle',{cx:v.x,cy:v.y,r:end?6:5,fill:end?'#FFF4E6':'#fff',stroke:'var(--inner)','stroke-width':2},svg); }));
  }

  if(S.mode==='sketch'){ S.strokes.forEach(st=>strokePath(st,'#9AA4B2')); if(S.cur)strokePath(S.cur,'var(--accent)'); }
  updateHint(); updateScale();
}
function drawGrid(){ const g=el('g',{},svg);
  const x0=Math.floor(vb.x/GRID)*GRID,y0=Math.floor(vb.y/GRID)*GRID;
  for(let x=x0;x<vb.x+vb.w;x+=GRID){ const s=Math.round(x/GRID)%5===0;
    el('line',{x1:x,y1:vb.y,x2:x,y2:vb.y+vb.h,stroke:s?'var(--grid-strong)':'var(--grid)','stroke-width':s?1.2:1},g); }
  for(let y=y0;y<vb.y+vb.h;y+=GRID){ const s=Math.round(y/GRID)%5===0;
    el('line',{x1:vb.x,y1:y,x2:vb.x+vb.w,y2:y,stroke:s?'var(--grid-strong)':'var(--grid)','stroke-width':s?1.2:1},g); }
}
/* 벽체 밴드: 방향으로 h만큼 연장 + 법선으로 ±두께/2 → 사각형 채움(두 모서리선 = 2선) */
function drawWallBand(a,b,th,color){
  const half=(th||DEF_TH_OUT)*PX_PER_MM/2, d=unit(a,b), n=perp(a,b);
  const A={x:a.x-d.x*half,y:a.y-d.y*half}, B={x:b.x+d.x*half,y:b.y+d.y*half};
  const p=[{x:A.x+n.x*half,y:A.y+n.y*half},{x:B.x+n.x*half,y:B.y+n.y*half},
           {x:B.x-n.x*half,y:B.y-n.y*half},{x:A.x-n.x*half,y:A.y-n.y*half}];
  const poly=el('polygon',{points:p.map(q=>`${q.x},${q.y}`).join(' '),fill:color,
    stroke:'#0E141C','stroke-width':1,'stroke-linejoin':'miter'},svg);
  poly.style.cursor='pointer';
}
function strokePath(st,color){ if(st.length<2){ if(st.length)el('circle',{cx:st[0].x,cy:st[0].y,r:4,fill:color},svg); return; }
  el('polyline',{points:st.map(p=>`${p.x},${p.y}`).join(' '),fill:'none',stroke:color,'stroke-width':4,'stroke-linejoin':'round','stroke-linecap':'round',opacity:.9},svg); }
function normal(a,b,c){ const n=perp(a,b),m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
  if((m.x-c.x)*n.x+(m.y-c.y)*n.y<0)return {x:-n.x,y:-n.y}; return n; }

/* 캐드식 치수: 양끝 보조선 + 치수선 + 중앙 박스(탭/롱프레스) */
function drawDim(a,b,mm,c,ref,off){
  const n=normal(a,b,c), measured=mm>0, shown=measured?mm:Math.round(dist(a,b)/PX_PER_MM);
  const half=thOf(ref)*PX_PER_MM/2;
  const base=off+half;
  const a1={x:a.x+n.x*half,y:a.y+n.y*half}, b1={x:b.x+n.x*half,y:b.y+n.y*half};       // 벽면
  const a2={x:a.x+n.x*(base+6),y:a.y+n.y*(base+6)}, b2={x:b.x+n.x*(base+6),y:b.y+n.y*(base+6)}; // 보조선 끝
  const ad={x:a.x+n.x*base,y:a.y+n.y*base}, bd={x:b.x+n.x*base,y:b.y+n.y*base};       // 치수선
  const g=el('g',{},svg);
  el('line',{x1:a1.x,y1:a1.y,x2:a2.x,y2:a2.y,stroke:'var(--dim-line)','stroke-width':1},g); // 보조선
  el('line',{x1:b1.x,y1:b1.y,x2:b2.x,y2:b2.y,stroke:'var(--dim-line)','stroke-width':1},g);
  el('line',{x1:ad.x,y1:ad.y,x2:bd.x,y2:bd.y,stroke:'var(--dim-line)','stroke-width':1},g); // 치수선
  // 끝 화살촉
  arrow(g,ad,bd); arrow(g,bd,ad);
  // 중앙 박스
  const mid={x:(ad.x+bd.x)/2,y:(ad.y+bd.y)/2};
  const txt=measured?String(shown):shown+' ?', tw=txt.length*8.5+14;
  const box=el('g',{},svg); box.dataset.ref=JSON.stringify(ref); box.style.cursor='pointer';
  el('rect',{x:mid.x-tw/2,y:mid.y-12,width:tw,height:24,rx:6,fill:'#fff',
    stroke:measured?'var(--measured)':'var(--unmeasured)','stroke-width':1.6},box);
  const t=el('text',{x:mid.x,y:mid.y,'text-anchor':'middle','dominant-baseline':'central','font-family':'IBM Plex Mono',
    'font-size':13,'font-weight':600,fill:measured?'var(--measured)':'var(--unmeasured)'},box); t.textContent=txt;
}
function arrow(g,from,to){ const d=unit(from,to),n=perp(from,to),s=5;
  const tip=from; const b1={x:tip.x+d.x*s+n.x*2.2,y:tip.y+d.y*s+n.y*2.2}, b2={x:tip.x+d.x*s-n.x*2.2,y:tip.y+d.y*s-n.y*2.2};
  el('polygon',{points:`${tip.x},${tip.y} ${b1.x},${b1.y} ${b2.x},${b2.y}`,fill:'var(--dim-line)'},g); }
function selSeg(sel){ if(sel.t==='o'){ const n=S.outline.length; if(!n)return null; return {a:S.outline[sel.w],b:S.outline[(sel.w+1)%n]}; }
  const w=S.interiors[sel.s]; if(!w)return null; return {a:w.pts[sel.w],b:w.pts[sel.w+1]}; }
function thOf(sel){ return sel.t==='o'? (S.outlineTh[sel.w]||DEF_TH_OUT) : (S.interiors[sel.s].th[sel.w]||DEF_TH_IN); }

function updateScale(){ const ppm=PX_PER_MM/svPerPx();
  const nice=[100,200,500,1000,2000,5000,10000,20000]; let m=1000;
  for(const cand of nice){ const w=cand*ppm; if(w>=70&&w<=200){m=cand;break;} if(w>200){m=cand;break;} }
  document.getElementById('scaleLine').style.width=Math.round(m*ppm)+'px';
  document.getElementById('scaleLabel').textContent=m>=1000?(m/1000)+'m':m+'mm';
}

/* =========================================================================
   손보정: RDP → 짧은조각 제거 → 30° 스냅
   ========================================================================= */
function rdp(pts,eps){ if(pts.length<3)return pts.slice();
  const a=pts[0],b=pts[pts.length-1];let dmax=0,idx=0;
  for(let i=1;i<pts.length-1;i++){ const d=distToSeg(pts[i],a,b).d; if(d>dmax){dmax=d;idx=i;} }
  if(dmax>eps){ const l=rdp(pts.slice(0,idx+1),eps),r=rdp(pts.slice(idx),eps);return l.slice(0,-1).concat(r); }
  return [a,b]; }
function dejunk(pts,closed){ const MIN=300*PX_PER_MM; let out=pts.slice();
  let guard=0; while(out.length>(closed?4:3) && guard++<50){ let done=true;
    for(let i=0;i<out.length-1;i++){ if(dist(out[i],out[i+1])<MIN){ out.splice(i+1,1); done=false; break; } }
    if(done)break; }
  return out; }
function snapChain(pts,closed){
  const nv=[{x:pts[0].x,y:pts[0].y}];
  for(let i=0;i<pts.length-1;i++){ const a=pts[i],b=pts[i+1];
    const len=dist(a,b); let deg=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
    const k=Math.round(deg/90), snapDeg=k*90;
    let ang=(Math.abs(deg-snapDeg)<=SNAP_DEG)? snapDeg : deg;
    const r=ang*Math.PI/180;
    nv.push({x:nv[i].x+Math.cos(r)*len, y:nv[i].y+Math.sin(r)*len});
  }
  return nv;
}
function snapToWalls(p,ignore){ let best=null; const R=60;
  const consider=(a,b)=>{ const r=distToSeg(p,a,b); if(r.d<R&&(!best||r.d<best.d))best={d:r.d,proj:r.proj}; };
  for(let i=0;i<S.outline.length;i++) consider(S.outline[i],S.outline[(i+1)%S.outline.length]);
  S.interiors.forEach((w,si)=>{ if(si===ignore)return; for(let j=0;j<w.pts.length-1;j++)consider(w.pts[j],w.pts[j+1]); });
  return best?best.proj:p; }

function convert(){
  const strokes=S.cur?S.strokes.concat([S.cur]):S.strokes.slice();
  if(!strokes.length){ flash('먼저 벽 모양을 그려주세요'); return; }
  pushHist();
  let outlineDone=!!S.outline.length; const newIn=[];
  strokes.forEach(st=>{
    let sp=rdp(st,16);
    const closed=sp.length>=4 && dist(sp[0],sp[sp.length-1])<50 && chainLen(sp)>140;
    if(closed) sp=sp.slice(0,-1);
    sp=dejunk(sp,closed);
    if(S.ortho) sp=snapChain(sp,closed);
    if(closed && !outlineDone){
      S.outline=sp; S.outlineMM=new Array(sp.length).fill(0); S.outlineTh=new Array(sp.length).fill(DEF_TH_OUT); outlineDone=true;
    } else {
      sp[0]=snapToWalls(sp[0]); sp[sp.length-1]=snapToWalls(sp[sp.length-1]);
      newIn.push({pts:sp, mm:new Array(sp.length-1).fill(0), th:new Array(sp.length-1).fill(DEF_TH_IN)});
    }
  });
  S.interiors=S.interiors.concat(newIn);
  S.strokes=[]; S.cur=null; S.sel=null;
  setMode('edit'); fit(); flash('치수박스 탭 = 선택 · 길게 누름 = 숫자입력');
}
function chainLen(pts){ let s=0;for(let i=0;i<pts.length-1;i++)s+=dist(pts[i],pts[i+1]);return s; }

/* =========================================================================
   포인터: 스케치 / 핀치 / 팬 / 정점드래그 / 탭+롱프레스
   ========================================================================= */
const pointers=new Map();
let startPan=null,moved=false,lastPinch=null,dragV=null,pending=null,lpTimer=null,lpFired=false;

svg.addEventListener('pointerdown',e=>{
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){ lastPinch=null;startPan=null;S.cur=null;dragV=null;cancelLP(); return; }
  if(pointers.size!==1) return;
  moved=false;
  if(S.mode==='sketch'){ S.cur=[toSvg(e.clientX,e.clientY)]; return; }
  const v=vertexAt(e.clientX,e.clientY);
  if(v){ dragV=v; pushHist(); return; }
  const ref=refAt(e.clientX,e.clientY);
  if(ref){ pending={ref,cx:e.clientX,cy:e.clientY}; lpFired=false;
    lpTimer=setTimeout(()=>{ lpFired=true; selectWall(ref); openNumpad(); },500); }
  else startPan={sx:e.clientX,sy:e.clientY,vbx:vb.x,vby:vb.y};
});
svg.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId))return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size>=2){ pinch(); return; }
  if(S.mode==='sketch'){ if(S.cur){ const p=toSvg(e.clientX,e.clientY);
    if(dist(p,S.cur[S.cur.length-1])>4){ S.cur.push(p); render(); } } return; }
  if(pending){ if(Math.abs(e.clientX-pending.cx)+Math.abs(e.clientY-pending.cy)>8){ cancelLP();
    startPan={sx:pending.cx,sy:pending.cy,vbx:vb.x,vby:vb.y}; pending=null; } }
  if(dragV){ moveVertex(dragV,toSvg(e.clientX,e.clientY)); render(); return; }
  if(startPan){ const dx=e.clientX-startPan.sx,dy=e.clientY-startPan.sy;
    if(Math.abs(dx)+Math.abs(dy)>7){ moved=true; const sc=svPerPx();
      vb.x=startPan.vbx-dx*sc; vb.y=startPan.vby-dy*sc; apply(); render(); } }
});
svg.addEventListener('pointerup',e=>{
  const single=pointers.size===1; const cx=e.clientX,cy=e.clientY;
  pointers.delete(e.pointerId); if(pointers.size<2)lastPinch=null;
  if(!single)return;
  if(S.mode==='sketch'){ if(S.cur&&S.cur.length>=2)S.strokes.push(S.cur); S.cur=null;
    document.getElementById('btnConvert').disabled=!S.strokes.length; render(); return; }
  if(dragV){ finalizeDrag(dragV); dragV=null; render(); return; }
  if(pending){ cancelLP(); if(!lpFired){ selectWall(pending.ref); openSel(); } pending=null; startPan=null; return; }
  startPan=null;
});
svg.addEventListener('pointercancel',e=>{ pointers.delete(e.pointerId); if(pointers.size<2)lastPinch=null; S.cur=null; dragV=null; cancelLP(); pending=null; });
function cancelLP(){ if(lpTimer){ clearTimeout(lpTimer); lpTimer=null; } }

function pinch(){ const ps=[...pointers.values()];
  const d=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y),mid={x:(ps[0].x+ps[1].x)/2,y:(ps[0].y+ps[1].y)/2};
  if(lastPinch){ const f=lastPinch.d/d,p=toSvg(mid.x,mid.y);
    vb.w*=f;vb.h*=f;vb.x=p.x-(p.x-vb.x)*f;vb.y=p.y-(p.y-vb.y)*f;
    const sc=svPerPx();vb.x-=(mid.x-lastPinch.mid.x)*sc;vb.y-=(mid.y-lastPinch.mid.y)*sc;apply();render(); }
  lastPinch={d,mid};
}
function refAt(cx,cy){ const h=document.elementFromPoint(cx,cy);
  let e=h; while(e && e!==svg){ if(e.dataset&&e.dataset.ref)return JSON.parse(e.dataset.ref); e=e.parentNode; } return null; }
function vertexAt(cx,cy){ const p=toSvg(cx,cy),R=22*svPerPx();
  for(let i=0;i<S.outline.length;i++) if(dist(p,S.outline[i])<R)return {t:'o',i};
  for(let s=0;s<S.interiors.length;s++){ const w=S.interiors[s];
    for(let i=0;i<w.pts.length;i++) if(dist(p,w.pts[i])<R)return {t:'in',s,i}; } return null; }
function axisH(a,b){ return Math.abs(b.x-a.x)>=Math.abs(b.y-a.y); }
function moveVertex(v,np){
  if(v.t==='o'){ const arr=S.outline,n=arr.length,prev=(v.i-1+n)%n,next=(v.i+1)%n;
    if(S.ortho){ const ph=axisH(arr[prev],arr[v.i]),nh=axisH(arr[v.i],arr[next]); arr[v.i]={x:np.x,y:np.y};
      arr[prev]= ph?{x:arr[prev].x,y:np.y}:{x:np.x,y:arr[prev].y};
      arr[next]= nh?{x:arr[next].x,y:np.y}:{x:np.x,y:arr[next].y};
    } else arr[v.i]={x:np.x,y:np.y};
  } else { const w=S.interiors[v.s],pts=w.pts,n=pts.length;
    if(S.ortho){ pts[v.i]={x:np.x,y:np.y};
      if(v.i>0){ const ph=axisH(pts[v.i-1],pts[v.i]); pts[v.i-1]= ph?{x:pts[v.i-1].x,y:np.y}:{x:np.x,y:pts[v.i-1].y}; }
      if(v.i<n-1){ const nh=axisH(pts[v.i],pts[v.i+1]); pts[v.i+1]= nh?{x:pts[v.i+1].x,y:np.y}:{x:np.x,y:pts[v.i+1].y}; }
    } else pts[v.i]={x:np.x,y:np.y}; }
}
function finalizeDrag(v){ if(v.t==='in'){ const w=S.interiors[v.s];
    if(v.i===0)w.pts[0]=snapToWalls(w.pts[0],v.s);
    if(v.i===w.pts.length-1)w.pts[v.i]=snapToWalls(w.pts[v.i],v.s); } recalcMM(); }
function recalcMM(){ for(let i=0;i<S.outline.length;i++) if(S.outlineMM[i]>0)
    S.outlineMM[i]=Math.round(dist(S.outline[i],S.outline[(i+1)%S.outline.length])/PX_PER_MM);
  S.interiors.forEach(w=>{ for(let j=0;j<w.pts.length-1;j++) if(w.mm[j]>0) w.mm[j]=Math.round(dist(w.pts[j],w.pts[j+1])/PX_PER_MM); }); }

const selbar=document.getElementById('selbar'),sbName=document.getElementById('sbName'),
      sbDimVal=document.getElementById('sbDimVal'),thVal=document.getElementById('thVal');
function curMM(sel){ return sel.t==='o'?S.outlineMM[sel.w]:S.interiors[sel.s].mm[sel.w]; }
function setMM(sel,mm){ if(sel.t==='o')S.outlineMM[sel.w]=mm; else S.interiors[sel.s].mm[sel.w]=mm; }
function setTh(sel,v){ if(sel.t==='o')S.outlineTh[sel.w]=v; else S.interiors[sel.s].th[sel.w]=v; }
function selectWall(ref){ S.sel=ref; render();
  sbName.textContent=ref.t==='o'?'외벽 #'+(ref.w+1):'내부벽';
  sbDimVal.textContent=curMM(ref)||'—'; thVal.textContent=thOf(ref); }
function openSel(){ selbar.classList.add('open'); syncZoombar(); }
function closeSel(){ selbar.classList.remove('open'); syncZoombar(); }
function syncZoombar(){ document.documentElement.style.setProperty('--dimh', selbar.classList.contains('open')?(selbar.offsetHeight+'px'):'0px'); }
function rebuildChain(sel){
  if(sel.t==='o'){ const n=S.outline.length; if(n<3)return; const dirs=[],lens=[];
    for(let i=0;i<n;i++){ dirs.push(unit(S.outline[i],S.outline[(i+1)%n])); lens.push(S.outlineMM[i]?S.outlineMM[i]*PX_PER_MM:dist(S.outline[i],S.outline[(i+1)%n])); }
    const nv=[{...S.outline[0]}]; for(let i=0;i<n-1;i++)nv.push({x:nv[i].x+dirs[i].x*lens[i],y:nv[i].y+dirs[i].y*lens[i]}); S.outline=nv;
  } else { const w=S.interiors[sel.s],n=w.pts.length; const dirs=[],lens=[];
    for(let i=0;i<n-1;i++){ dirs.push(unit(w.pts[i],w.pts[i+1])); lens.push(w.mm[i]?w.mm[i]*PX_PER_MM:dist(w.pts[i],w.pts[i+1])); }
    const nv=[{...w.pts[0]}]; for(let i=0;i<n-1;i++)nv.push({x:nv[i].x+dirs[i].x*lens[i],y:nv[i].y+dirs[i].y*lens[i]}); w.pts=nv; }
}
document.getElementById('sbClose').onclick=()=>{ S.sel=null; closeSel(); closeNumpad(); render(); };
document.getElementById('sbDim').onclick=()=>openNumpad();
document.getElementById('sbLaser').onclick=()=>{ if(!laser.connected){ document.getElementById('laserPop').classList.add('open'); flash('먼저 레이저를 연결하세요'); return; } flash('측정기 버튼을 누르면 이 벽에 들어갑니다'); };
document.getElementById('thMinus').onclick=()=>stepTh(-10);
document.getElementById('thPlus').onclick=()=>stepTh(10);
function stepTh(d){ if(!S.sel)return; let v=thOf(S.sel)+d; v=Math.max(60,Math.min(400,v));
  pushHist(); setTh(S.sel,v); thVal.textContent=v; render(); }

const numpad=document.getElementById('numpad'),npVal=document.getElementById('npVal'),
      npHead=document.getElementById('npHead'),npGrid=document.getElementById('npGrid');
let npBuf='';
['1','2','3','4','5','6','7','8','9','⌫','0','✓'].forEach(k=>{ const b=document.createElement('button');
  b.textContent=k; if(k==='⌫')b.className='del'; if(k==='✓')b.className='ok';
  b.onclick=()=>npKey(k); npGrid.appendChild(b); });
function openNumpad(){ if(!S.sel)return; openSel(); npBuf=String(curMM(S.sel)||'');
  npHead.textContent=(S.sel.t==='o'?'외벽 #'+(S.sel.w+1):'내부벽')+' 치수';

/* =========================================================================
   줌 / 맞춤 / 툴바 / 힌트

function zoomAt(cx,cy,f){ const p=toSvg(cx,cy);vb.w*=f;vb.h*=f;vb.x=p.x-(p.x-vb.x)*f;vb.y=p.y-(p.y-vb.y)*f;apply();render(); }
svg.addEventListener('wheel',e=>{ e.preventDefault(); zoomAt(e.clientX,e.clientY,e.deltaY>0?1.12:0.9); },{passive:false});
document.getElementById('zIn').onclick=()=>zoomAt(svg.clientWidth/2,svg.clientHeight/2,0.82);
document.getElementById('zOut').onclick=()=>zoomAt(svg.clientWidth/2,svg.clientHeight/2,1.22);
document.getElementById('zFit').onclick=fit;
function allPts(){ let a=[...S.outline]; S.interiors.forEach(w=>a=a.concat(w.pts)); S.strokes.forEach(s=>a=a.concat(s)); if(S.cur)a=a.concat(S.cur); return a; }
function fit(){ const pts=allPts(); if(!pts.length){ vb={x:0,y:0,w:1600,h:1000};apply();render();return; }
  let a=1e9,b=1e9,c=-1e9,d=-1e9; pts.forEach(p=>{a=Math.min(a,p.x);b=Math.min(b,p.y);c=Math.max(c,p.x);d=Math.max(d,p.y);});
  const pad=180;a-=pad;b-=pad;c+=pad;d+=pad; const w=c-a,h=d-b,ar=svg.clientWidth/svg.clientHeight;let W=w,H=h;
  if(w/h>ar)H=w/ar;else W=h*ar; vb={x:a-(W-w)/2,y:b-(H-h)/2,w:W,h:H};apply();render(); }

function setMode(m){ S.mode=m;
  document.getElementById('btnSketch').classList.toggle('primary',m==='sketch');
  document.getElementById('btnConvert').disabled=!(m==='sketch'&&(S.strokes.length||S.cur));
  if(m==='sketch'){ S.sel=null; closeSel(); closeNumpad(); } render(); }

  b.textContent=S.ortho?'⊾ 직각보정 30°':'⊾ 보정 OFF'; flash(S.ortho?'30° 이내는 직각으로 보정':'보정 꺼짐(손그림 그대로)'); };

  else m='치수박스 탭=치수 · 코너 끌기=수정 · 두 손가락=확대';

/* =========================================================================
   DXF (외곽/내부/치수 레이어)
   ========================================================================= */
function exportDXF(){
  if(S.outline.length<3){ flash('먼저 평면도를 만들어주세요'); return; }
  const all=allPts(),minx=Math.min(...all.map(p=>p.x)),maxy=Math.max(...all.map(p=>p.y));
  const X=v=>Math.round((v.x-minx)/PX_PER_MM),Y=v=>Math.round((maxy-v.y)/PX_PER_MM);
  let d='0\nSECTION\n2\nENTITIES\n';
  d+='0\nLWPOLYLINE\n8\nWALL\n90\n'+S.outline.length+'\n70\n1\n'; S.outline.forEach(v=>{ d+='10\n'+X(v)+'\n20\n'+Y(v)+'\n'; });
  S.interiors.forEach(w=>{ d+='0\nLWPOLYLINE\n8\nINNER\n90\n'+w.pts.length+'\n70\n0\n'; w.pts.forEach(v=>{ d+='10\n'+X(v)+'\n20\n'+Y(v)+'\n'; }); });
  const addDim=(a,b,mm)=>{ const len=mm||Math.round(dist(a,b)/PX_PER_MM);
    d+='0\nTEXT\n8\nDIM\n10\n'+Math.round((X(a)+X(b))/2)+'\n20\n'+Math.round((Y(a)+Y(b))/2)+'\n40\n120\n1\n'+len+'\n'; };
  for(let i=0;i<S.outline.length;i++) addDim(S.outline[i],S.outline[(i+1)%S.outline.length],S.outlineMM[i]);
  S.interiors.forEach(w=>{ for(let j=0;j<w.pts.length-1;j++) addDim(w.pts[j],w.pts[j+1],w.mm[j]); });
  d+='0\nENDSEC\n0\nEOF\n';
  const blob=new Blob([d],{type:'application/dxf'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='kcc_실측도면_'+Date.now()+'.dxf';a.click();URL.revokeObjectURL(url);flash('DXF 저장됨');
}

  enableCmd:new Uint8Array([0xc0,0x55,0x02,0x01,0x00,0x1a]),pktPrefix:[0xc0,0x55,0x10,0x06],

async function connect(){ if(!navigator.bluetooth){ stat('err','Web Bluetooth 미지원'); lg('⚠ 안드로이드 Chrome + https 필요'); return; }
  if(laser.device&&laser.device.gatt.connected){ laser.device.gatt.disconnect(); return; }
  try{ stat('off','기기 선택 대기…'); lg('▶ 기기 검색…');
    laser.device=await navigator.bluetooth.requestDevice({filters:[{services:[BOSCH.svc]}],optionalServices:[BOSCH.svc]});
    lg('· 선택: '+(laser.device.name||'GLM'));
    laser.device.addEventListener('gattserverdisconnected',()=>{laser.connected=false;stat('off','연결 끊김');lg('· 연결 끊김');});
    const server=await laser.device.gatt.connect(),svc=await server.getPrimaryService(BOSCH.svc);
    laser.char=await svc.getCharacteristic(BOSCH.char); await laser.char.startNotifications();
    laser.char.addEventListener('characteristicvaluechanged',e=>onRaw(e.target.value));
    await laser.char.writeValueWithResponse(BOSCH.enableCmd);
    laser.connected=true; stat('on','연결됨 · '+(laser.device.name||'GLM')); lg('✔ 준비 완료 — 벽 선택 후 측정');
  }catch(err){ if(err.name==='NotFoundError'){stat('off','선택 취소');lg('· 취소');}else{stat('err','연결 실패');lg('✖ '+err.message);} } }
function onRaw(dv){ const hex=[...new Uint8Array(dv.buffer)].map(b=>b.toString(16).padStart(2,'0')).join(' ');lg('◀ '+hex);
  let mm=null;try{mm=BOSCH.parse(dv);}catch(e){}
  if(mm!=null&&isFinite(mm)){ $('lsVal').innerHTML=mm+' <small>mm</small>';lg('  → '+mm+' mm');
    if(autofill&&S.sel){ pushHist(); setMM(S.sel,mm); rebuildChain(S.sel); sbDimVal.textContent=mm; if(numpad.classList.contains('open')){npBuf=String(mm);npVal.textContent=npBuf;} render(); flash('→ '+mm+'mm 적용'); } } }

/* ---------- 시작 ---------- */
setMode('sketch'); apply(); render(); syncZoombar();
window.addEventListener('resize',()=>{ syncZoombar(); render(); });
</script>
