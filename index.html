<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ballo · 현장 실측 평면도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#DFE3EA; --paper:#FFFFFF; --panel:#FFFFFF; --ink:#141821; --muted:#6B7686;
    --line:#D7DDE6; --grid:#EEF1F6; --grid-strong:#E2E7EF;
    --wall:#232C3A; --inner:#3B4658; --hatch:#525A63;
    --measured:#0E7C66; --unmeasured:#C2410C; --active:#0E9F6E;
    --sel:#1D6FE0; --accent:#E1251B; --dim-line:#9AA4B2;
    --shadow:0 10px 34px rgba(20,30,50,.16);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
  html,body{height:100%;margin:0;}
  body{font-family:"Space Grotesk",system-ui,sans-serif;color:var(--ink);background:var(--bg);
    overflow:hidden;touch-action:none;display:flex;flex-direction:column;}
  .mono{font-family:"IBM Plex Mono",monospace;}

  header{height:54px;flex:0 0 54px;background:var(--panel);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:6px;padding:0 10px;z-index:40;overflow-x:auto;}
  .brand{display:flex;align-items:center;gap:8px;margin-right:2px;flex:0 0 auto;}
  .brand .dot{width:9px;height:9px;border-radius:2px;background:var(--accent);}
  .brand b{font-weight:700;font-size:14px;letter-spacing:-.2px;white-space:nowrap;}
  .btn{height:38px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel);
    color:var(--ink);font-family:inherit;font-weight:600;font-size:13px;white-space:nowrap;
    display:inline-flex;align-items:center;gap:6px;cursor:pointer;flex:0 0 auto;}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);}
  .btn.go{background:var(--sel);color:#fff;border-color:var(--sel);}
  .btn.on{background:#E7F6EE;border-color:#A6E4C8;color:#0E7A50;}
  .btn.warn{color:var(--accent);border-color:#F0CBC8;}
  .btn.icon{width:38px;padding:0;justify-content:center;font-size:17px;}
  .btn:disabled{opacity:.4;pointer-events:none;}
  select{height:38px;border-radius:9px;border:1px solid var(--line);background:var(--panel);
    font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:12px;padding:0 6px;color:var(--ink);flex:0 0 auto;}
  .spacer{flex:1 0 6px;}

  .stage{flex:1;position:relative;min-height:0;}
  svg#plan{width:100%;height:100%;display:block;background:var(--bg);touch-action:none;}
  @keyframes blink{0%,100%{opacity:.85}50%{opacity:.2}}
  .blink{animation:blink 1s ease-in-out infinite;}

  .hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);
    background:rgba(20,24,33,.92);color:#fff;padding:7px 14px;border-radius:22px;
    font-size:12px;font-weight:600;pointer-events:none;z-index:20;white-space:nowrap;box-shadow:var(--shadow);}
  .hint b{color:#89B4FF;}
  .paperlbl{position:absolute;left:14px;top:12px;z-index:20;background:rgba(255,255,255,.9);
    border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-family:"IBM Plex Mono",monospace;
    font-size:11px;font-weight:600;color:var(--ink);box-shadow:0 2px 8px rgba(20,30,50,.08);}

  .zoombar{position:absolute;right:14px;bottom:calc(14px + var(--dimh,0px));display:flex;flex-direction:column;
    gap:7px;z-index:20;transition:bottom .2s;}
  .zoombar .btn{width:44px;height:44px;justify-content:center;font-size:20px;box-shadow:var(--shadow);}

  .thbar{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);
    box-shadow:0 -8px 26px rgba(20,30,50,.10);z-index:30;padding:11px 14px calc(11px + env(safe-area-inset-bottom));
    transform:translateY(120%);transition:transform .24s cubic-bezier(.4,0,.2,1);display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .thbar.open{transform:translateY(0);}
  .thbar .lab{font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px;}
  .thbar .lab .sq{width:15px;height:15px;border-radius:3px;background:var(--sel);}
  .th{display:flex;align-items:center;gap:8px;background:#F4F6F9;border:1px solid var(--line);border-radius:12px;padding:5px 8px;}
  .th .t{font-size:11px;font-weight:700;color:var(--muted);}
  .th button{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:19px;font-weight:700;cursor:pointer;color:var(--ink);}
  .th .v{font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:17px;min-width:52px;text-align:center;}
  .thbar .grow{flex:1 0 8px;}

  .numpad{position:absolute;left:50%;bottom:16px;transform:translate(-50%,140%);width:284px;max-width:calc(100vw - 24px);
    background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);z-index:50;padding:12px;
    transition:transform .22s cubic-bezier(.4,0,.2,1);}
  .numpad.open{transform:translate(-50%,0);}
  .np-head{font-size:12px;font-weight:700;color:var(--muted);margin:2px 2px 8px;display:flex;justify-content:space-between;align-items:center;}
  .np-val{font-family:"IBM Plex Mono",monospace;font-size:30px;font-weight:600;text-align:right;padding:6px 12px;background:#F1F4F9;border-radius:10px;margin-bottom:10px;min-height:48px;}
  .np-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .np-grid button{height:52px;border-radius:12px;border:1px solid var(--line);background:#fff;font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:600;cursor:pointer;color:var(--ink);}
  .np-grid button:active{background:#EEF2F7;}
  .np-grid .ok{background:var(--sel);color:#fff;border-color:var(--sel);}
  .np-grid .del{background:#FFF3F2;color:var(--accent);border-color:#F0CBC8;font-size:18px;}

  .laser-pop{position:absolute;top:60px;right:12px;width:320px;max-width:calc(100vw - 24px);background:var(--panel);
    border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);z-index:60;padding:14px;display:none;}
  .laser-pop.open{display:block;}
  .laser-pop h4{margin:0 0 8px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px;}
  .laser-pop .st{font-size:12px;font-weight:600;margin-bottom:10px;}
  .st.off{color:var(--muted);} .st.on{color:var(--measured);} .st.err{color:var(--accent);}
  .laser-pop .val{font-family:"IBM Plex Mono",monospace;font-size:28px;font-weight:600;text-align:center;padding:10px;background:#F1F4F9;border-radius:10px;margin:10px 0;}
  .laser-pop .val small{font-size:14px;color:var(--muted);}
  .laser-pop .log{font-family:"IBM Plex Mono",monospace;font-size:9.5px;background:#0E1116;color:#8FE3B0;border-radius:8px;padding:8px;height:60px;overflow-y:auto;white-space:pre-wrap;line-height:1.45;margin-top:8px;}
  .switch{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;}
  .switch input{width:40px;height:22px;}
  ::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:#C3CBD6;border-radius:8px;}
</style>
</head>
<body>

<header>
  <div class="brand"><span class="dot"></span><b>ballo</b></div>
  <button class="btn primary" id="btnSketch">✎ 그리기</button>
  <button class="btn go" id="btnConvert" disabled>→ 변환</button>
  <button class="btn on" id="btnOrtho">⊾ 30°</button>
  <select id="selSize"><option value="A3">A3</option><option value="A4">A4</option></select>
  <select id="selScale"></select>
  <div class="spacer"></div>
  <button class="btn" id="btnLaser">📡</button>
  <button class="btn" id="btnDoor">🚪 도어</button>
  <button class="btn" id="btnExport">DXF</button>
  <button class="btn icon" id="btnSave" title="저장">💾</button>
  <button class="btn icon" id="btnOpen" title="열기">📂</button>
  <input type="file" id="fileInput" accept=".json,.ballo" style="display:none">
  <button class="btn warn icon" id="btnUndo" title="되돌리기">↶</button>
  <button class="btn warn icon" id="btnClear" title="지우기">🗑</button>
</header>

<div class="stage">
  <svg id="plan" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="hint" id="hint"></div>
  <div class="paperlbl" id="paperLbl">A3 · 1:50</div>
  <div class="zoombar">
    <button class="btn icon" id="zIn">＋</button>
    <button class="btn icon" id="zOut">－</button>
    <button class="btn icon" id="zFit" title="용지 맞춤">⤢</button>
  </div>

  <!-- 방 정보 바 -->
  <div class="thbar" id="roombar">
    <div class="lab"><span class="sq" style="background:#0E9F6E"></span><span id="rbArea">방</span></div>
    <div class="th"><span class="t">위치명</span><input id="rbName" placeholder="거실/안방…" style="width:96px;border:1px solid var(--line);border-radius:8px;height:38px;padding:0 8px;font-weight:600;-webkit-user-select:text;user-select:text"></div>
    <div class="th"><span class="t">FL</span><input id="rbFL" inputmode="numeric" value="0" style="width:60px;text-align:center;border:1px solid var(--line);border-radius:8px;height:38px;font-family:'IBM Plex Mono';font-weight:700;-webkit-user-select:text;user-select:text"></div>
    <div class="th"><span class="t">CH</span><input id="rbCH" inputmode="numeric" value="2300" style="width:66px;text-align:center;border:1px solid var(--line);border-radius:8px;height:38px;font-family:'IBM Plex Mono';font-weight:700;-webkit-user-select:text;user-select:text"></div>
    <div class="grow"></div>
    <button class="btn icon" id="rbClose">✕</button>
  </div>

  <!-- 벽체 두께 바 -->
  <div class="thbar" id="thbar">
    <div class="lab"><span class="sq"></span><span id="tbName">벽체</span></div>
    <div class="th"><span class="t">전체 벽두께</span><input class="v" id="thInput" inputmode="numeric" value="180" style="width:66px;text-align:center;border:1px solid var(--line);border-radius:8px;height:38px;font-family:'IBM Plex Mono';font-weight:700;-webkit-user-select:text;user-select:text"><span class="t">mm</span></div>
    <div class="grow"></div>
    <button class="btn icon" id="tbClose">✕</button>
  </div>

  <!-- 숫자패드 -->
  <div class="numpad" id="numpad">
    <div class="np-head"><span id="npHead">치수(내경) 입력</span><span class="mono" style="color:var(--muted)">mm</span></div>
    <div class="np-val" id="npVal">0</div>
    <div class="np-grid" id="npGrid"></div>
  </div>

  <div class="laser-pop" id="laserPop"></div>
</div>

<script>
/* =========================================================================
   KCC 평면도 v4 — 좌표계 = 실측 mm, 용지(A3/A4)+스케일 캔버스
   ========================================================================= */
const svg=document.getElementById('plan');
const NS='http://www.w3.org/2000/svg';
let vb={x:0,y:0,w:1000,h:700};

const PAPER={A3:{w:420,h:297},A4:{w:297,h:210}};   // mm (가로방향)
const SCALES=[10,20,30,40,50,60,80,100,150];
let paperSize='A3', scale=60;
let DEF_TH=180; const SNAP_DEG=30;
function paperW(){ return PAPER[paperSize].w*scale; }   // 실측 mm 영역
function paperH(){ return PAPER[paperSize].h*scale; }

const S={ mode:'sketch', ortho:true, strokes:[], cur:null,
  outline:[], outlineMM:[], outlineTh:[], interiors:[],
  activeBox:null, selWall:null, rooms:[], roomMeta:[], doors:[] };

let history=[];
function pushHist(){ history.push(JSON.stringify({o:S.outline,om:S.outlineMM,ot:S.outlineTh,in:S.interiors,st:S.strokes}));
  if(history.length>80)history.shift(); }
function undo(){ if(!history.length){ flash('되돌릴 게 없어요'); return; }
  const h=JSON.parse(history.pop());
  S.outline=h.o;S.outlineMM=h.om;S.outlineTh=h.ot;S.interiors=h.in;S.strokes=h.st||[];S.cur=null;
  S.activeBox=null;S.selWall=null;closeTh();closeNumpad();
  document.getElementById('btnConvert').disabled=!(S.mode==='sketch'&&S.strokes.length);
  render(); }

/* ---------- 기하 (전부 실측 mm) ---------- */
function toSvg(cx,cy){ const p=svg.createSVGPoint();p.x=cx;p.y=cy;
  const q=p.matrixTransform(svg.getScreenCTM().inverse());return {x:q.x,y:q.y}; }
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function unit(a,b){ const dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1;return {x:dx/l,y:dy/l}; }
function perp(a,b){ const d=unit(a,b);return {x:-d.y,y:d.x}; }
function apply(){ svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }
function el(t,a={},p){ const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e; }
function centroid(pts){ let x=0,y=0;pts.forEach(p=>{x+=p.x;y+=p.y;});return {x:x/pts.length,y:y/pts.length}; }
function distToSeg(p,a,b){ const dx=b.x-a.x,dy=b.y-a.y,L2=dx*dx+dy*dy||1;
  let t=((p.x-a.x)*dx+(p.y-a.y)*dy)/L2;t=Math.max(0,Math.min(1,t));
  const pr={x:a.x+t*dx,y:a.y+t*dy};return {d:dist(p,pr),t,proj:pr}; }
const k=()=>vb.w/svg.clientWidth;   // 실측mm / 화면px  (요소 크기 보정용)

/* =========================================================================
   렌더링
   ========================================================================= */
function render(){
  apply(); svg.innerHTML=''; drawPaper(); drawGrid();
  const K=k();

  if(S.mode==='edit'){
    const c=S.outline.length?centroid(S.outline):{x:0,y:0};
    // 벽체: 안쪽 진회색 솔리드 + 2선 (접합부는 내부벽 채움이 안쪽선을 덮어 뚫림)
    if(S.outline.length>=3){
      const outer=offsetPoly(S.outline,DEF_TH/2), inner=offsetPoly(S.outline,-DEF_TH/2);
      fillRing(outer,inner,'var(--hatch)');                 // 외벽 링 채움
      polyLine(outer,true,'var(--wall)',1.6*K); polyLine(inner,true,'var(--wall)',1.6*K);
      S.interiors.forEach(w=>fillInner(w,'var(--hatch)'));  // 내부벽 채움 → 접합부 안쪽선 덮음(물 흐르듯)
    } else S.interiors.forEach(w=>fillInner(w,'var(--hatch)'));
    // 내부벽 2선
    S.interiors.forEach(w=>drawInner(w,K));
    // 벽체 히트라인(중심선, 벽체 선택용)
    for(let i=0;i<S.outline.length;i++) hitWall(S.outline[i],S.outline[(i+1)%S.outline.length],{t:'o',w:i},K);
    S.interiors.forEach((w,s)=>{ for(let j=0;j<w.pts.length-1;j++) hitWall(w.pts[j],w.pts[j+1],{t:'in',s,w:j},K); });
    // 벽체 선택 하이라이트
    if(S.selWall){ const g=selSeg(S.selWall); if(g){ const h=el('line',{x1:g.a.x,y1:g.a.y,x2:g.b.x,y2:g.b.y,
      stroke:'var(--sel)','stroke-width':DEF_TH,'stroke-linecap':'butt',opacity:.18},svg); } }
    // 치수 : 도면 바깥 연속 치수선(내경 구간 + 전체)
    drawDimensions(c,K);
    syncRooms(); drawRooms(K); drawDoors(K);
  }
  if(S.mode==='sketch'){ drawGhost(K); S.strokes.forEach(st=>strokePath(st,'#8A93A2',K)); if(S.cur)strokePath(S.cur,'var(--accent)',K); }
  updatePaperLbl(); updateHint();
}
function drawPaper(){
  el('rect',{x:0,y:0,width:paperW(),height:paperH(),fill:'var(--paper)',stroke:'#B9C1CD','stroke-width':2*k()},svg);
}
function drawGrid(){ const g=el('g',{},svg); const step=1000; // 1m 격자(실측)
  const x0=Math.max(0,Math.floor(vb.x/step)*step), y0=Math.max(0,Math.floor(vb.y/step)*step);
  for(let x=x0;x<Math.min(vb.x+vb.w,paperW());x+=step) el('line',{x1:x,y1:0,x2:x,y2:paperH(),stroke:'var(--grid)','stroke-width':k()},g);
  for(let y=y0;y<Math.min(vb.y+vb.h,paperH());y+=step) el('line',{x1:0,y1:y,x2:paperW(),y2:y,stroke:'var(--grid)','stroke-width':k()},g);
}
function polyLine(pts,closed,color,wd){ const d=pts.map((p,i)=>(i?'L':'M')+p.x+' '+p.y).join(' ')+(closed?' Z':'');
  el('path',{d,fill:'none',stroke:color,'stroke-width':wd,'stroke-linejoin':'miter','stroke-miterlimit':8},svg); }
function pathD(pts,closed){ return pts.map((p,i)=>(i?'L':'M')+p.x+' '+p.y).join(' ')+(closed?' Z':''); }
/* 외벽 링(바깥-안쪽) 진회색 채움 */
function fillRing(outer,inner,color){ el('path',{d:pathD(outer,true)+' '+pathD(inner,true),fill:color,'fill-rule':'evenodd',stroke:'none'},svg); }
/* 내부벽 두께 밴드 진회색 채움 (끝을 살짝 연장해 접합부 병합) */
function fillInner(w,color){ const t=DEF_TH/2;
  for(let j=0;j<w.pts.length-1;j++){ const a=w.pts[j],b=w.pts[j+1],d=unit(a,b),n=perp(a,b);
    const A={x:a.x-d.x*t,y:a.y-d.y*t}, B={x:b.x+d.x*t,y:b.y+d.y*t};
    const q=[{x:A.x+n.x*t,y:A.y+n.y*t},{x:B.x+n.x*t,y:B.y+n.y*t},{x:B.x-n.x*t,y:B.y-n.y*t},{x:A.x-n.x*t,y:A.y-n.y*t}];
    el('polygon',{points:q.map(p=>`${p.x},${p.y}`).join(' '),fill:color,stroke:'none'},svg); } }
function drawInner(w,K){
  if(w.pts.length<2)return;
  const c=trimInner(w.pts);                       // 끝을 벽 안쪽 면까지 트림
  const L=offsetOpen(c,DEF_TH/2), R=offsetOpen(c,-DEF_TH/2);
  polyPath(L,'var(--inner)',1.5*K); polyPath(R,'var(--inner)',1.5*K);
}
/* 내부벽 양 끝을 벽두께/2 만큼 안으로 당김 = 외벽 중심선이 아닌 안쪽 면에서 끝남 */
function trimInner(pts){ const t=DEF_TH/2, p=pts.map(v=>({x:v.x,y:v.y})), n=p.length;
  if(n>=2 && chainLen(p)>t*3){ const d0=unit(p[0],p[1]); p[0]={x:p[0].x+d0.x*t,y:p[0].y+d0.y*t};
    const dl=unit(p[n-1],p[n-2]); p[n-1]={x:p[n-1].x+dl.x*t,y:p[n-1].y+dl.y*t}; }
  return p; }
/* 열린 폴리라인 오프셋 (코너 miter = 필렛 이음) */
function offsetOpen(pts,off){ const n=pts.length,out=[];
  for(let i=0;i<n;i++){ const n1=i>0?perp(pts[i-1],pts[i]):null, n2=i<n-1?perp(pts[i],pts[i+1]):null;
    if(n1&&n2){ let x=n1.x+n2.x,y=n1.y+n2.y;const l=Math.hypot(x,y)||1;x/=l;y/=l;
      const cos=Math.max(n1.x*x+n1.y*y,0.4); out.push({x:pts[i].x+x*off/cos,y:pts[i].y+y*off/cos}); }
    else { const nn=n1||n2; out.push({x:pts[i].x+nn.x*off,y:pts[i].y+nn.y*off}); } }
  return out; }
function polyPath(pts,color,wd){ const d=pts.map((p,i)=>(i?'L':'M')+p.x+' '+p.y).join(' ');
  el('path',{d,fill:'none',stroke:color,'stroke-width':wd,'stroke-linejoin':'miter','stroke-miterlimit':8},svg); }
function drawGhost(K){
  if(S.outline.length>=3) polyLine(S.outline,true,'#C3CBD6',1.4*K);
  S.interiors.forEach(w=>{ if(w.pts.length>=2) polyPath(w.pts,'#C3CBD6',1.2*K); });
}
function strokePath(st,color,K){ if(st.length<2){ if(st.length)el('circle',{cx:st[0].x,cy:st[0].y,r:3*K,fill:color},svg); return; }

function rdp(pts,eps){ if(pts.length<3)return pts.slice();
  const a=pts[0],b=pts[pts.length-1];let dmax=0,idx=0;
  for(let i=1;i<pts.length-1;i++){ const d=distToSeg(pts[i],a,b).d; if(d>dmax){dmax=d;idx=i;} }
  if(dmax>eps){ const l=rdp(pts.slice(0,idx+1),eps),r=rdp(pts.slice(idx),eps);return l.slice(0,-1).concat(r); }
  return [a,b]; }
function dejunk(pts,closed){ const MIN=Math.max(300,scale*8); let out=pts.slice(),guard=0;
  while(out.length>(closed?4:3)&&guard++<60){ let done=true;
    for(let i=0;i<out.length-1;i++){ if(dist(out[i],out[i+1])<MIN){ out.splice(i+1,1);done=false;break; } } if(done)break; }
  return out; }
function snapChain(pts){ const nv=[{x:pts[0].x,y:pts[0].y}];
  for(let i=0;i<pts.length-1;i++){ const a=pts[i],b=pts[i+1],len=dist(a,b);
    let deg=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI; const kk=Math.round(deg/90),sd=kk*90;
    const ang=(Math.abs(deg-sd)<=SNAP_DEG?sd:deg)*Math.PI/180;
    nv.push({x:nv[i].x+Math.cos(ang)*len,y:nv[i].y+Math.sin(ang)*len}); } return nv; }
function cluster(vals,thr){ const s=[...vals].sort((a,b)=>a-b),groups=[]; let cur=[s[0]];
  for(let i=1;i<s.length;i++){ if(s[i]-cur[cur.length-1]<thr)cur.push(s[i]); else {groups.push(cur);cur=[s[i]];} }
  groups.push(cur); return groups.map(g=>g.reduce((a,b)=>a+b,0)/g.length); }
function alignAxis(pts){ const thr=Math.max(250,scale*6);
  const gx=cluster(pts.map(p=>p.x),thr),gy=cluster(pts.map(p=>p.y),thr);
  const near=(v,g)=>{ let b=g[0]; for(const x of g)if(Math.abs(x-v)<Math.abs(b-v))b=x; return b; };
  return pts.map(p=>({x:near(p.x,gx),y:near(p.y,gy)})); }
/* ★ 전체 벽 정점을 한꺼번에 공통 격자에 정렬 → 벽끼리 만남 */
function alignAll(){
  const V=[]; S.outline.forEach(v=>V.push(v)); S.interiors.forEach(w=>w.pts.forEach(v=>V.push(v)));
  if(V.length<2)return; const thr=Math.max(300,scale*8);
  const gx=cluster(V.map(p=>p.x),thr),gy=cluster(V.map(p=>p.y),thr);
  const nb=(v,g)=>{ let b=g[0]; for(const x of g)if(Math.abs(x-v)<Math.abs(b-v))b=x; return b; };
  S.outline=S.outline.map(v=>({x:nb(v.x,gx),y:nb(v.y,gy)}));
  S.interiors.forEach(w=>{ w.pts=w.pts.map(v=>({x:nb(v.x,gx),y:nb(v.y,gy)})); });
}
/* ★ 내부벽 끝점을 벽(선 투영/정점)에 연결 · 닿았는지 여부 반환 */
function snapEnd(p,ignore){
  const R=Math.max(1200,scale*22); let best=null;
  const consSeg=(a,b)=>{ const r=distToSeg(p,a,b); if(r.d<R&&(!best||r.d<best.d))best={d:r.d,pt:r.proj}; };
  for(let i=0;i<S.outline.length;i++) consSeg(S.outline[i],S.outline[(i+1)%S.outline.length]);
  S.interiors.forEach((w,si)=>{ if(si===ignore)return; for(let j=0;j<w.pts.length-1;j++)consSeg(w.pts[j],w.pts[j+1]); });
  const tryV=v=>{ const dd=dist(p,v); if(dd<R&&(!best||dd<best.d))best={d:dd,pt:{x:v.x,y:v.y}}; };
  S.outline.forEach(tryV); S.interiors.forEach((w,si)=>{ if(si===ignore)return; w.pts.forEach(tryV); });
  return best? {pt:best.pt,hit:true} : {pt:p,hit:false};
}
/* 점이 외곽 안인지 */
function pointInPoly(p,poly){ let c=false; for(let i=0,j=poly.length-1;i<poly.length;j=i++){
  if(((poly[i].y>p.y)!==(poly[j].y>p.y)) && (p.x<(poly[j].x-poly[i].x)*(p.y-poly[i].y)/((poly[j].y-poly[i].y)||1e-9)+poly[i].x)) c=!c; } return c; }
/* 외곽 밖이면 가장 가까운 외곽선에 투영 */
function clampToOutline(p){ if(S.outline.length<3||pointInPoly(p,S.outline))return p;
  let best=null; const n=S.outline.length;
  for(let i=0;i<n;i++){ const r=distToSeg(p,S.outline[i],S.outline[(i+1)%n]); if(!best||r.d<best.d)best=r; }
  return best?best.proj:p; }
/* 끝 연결 + 외곽 클램프 + 뜬 자투리 제거 */
function snapInteriorEnds(){ const keep=[];
  S.interiors.forEach((w,si)=>{ if(w.pts.length<2)return;
    w.pts=w.pts.map(v=>clampToOutline(v));           // 삐져나간 점 외곽 안으로
    const r0=snapEnd(w.pts[0],si), r1=snapEnd(w.pts[w.pts.length-1],si);
    w.pts[0]=r0.pt; w.pts[w.pts.length-1]=r1.pt;
    const floating = !r0.hit && !r1.hit;
    if(floating && chainLen(w.pts) < Math.max(2000,scale*40)) return;
    keep.push(w); });
  S.interiors=keep;
}
/* ★ 외곽 삐침(overshoot)·중복정점·일직선 정리 */
function colin(a,b,c){ if(Math.abs(a.y-b.y)<1&&Math.abs(b.y-c.y)<1)return true;
  if(Math.abs(a.x-b.x)<1&&Math.abs(b.x-c.x)<1)return true; return false; }
function cleanupOutline(){ if(S.outline.length<4)return;
  const MERGE=Math.max(200,scale*5); let out=[];
  for(const v of S.outline){ if(!out.length||dist(out[out.length-1],v)>MERGE)out.push(v); }
  if(out.length>1 && dist(out[0],out[out.length-1])<MERGE)out.pop();
  const res=[],n=out.length;
  for(let i=0;i<n;i++){ const a=out[(i-1+n)%n],b=out[i],c=out[(i+1)%n]; if(colin(a,b,c))continue; res.push(b); }
  S.outline = res.length>=3? res : out;
}
/* ★ 외곽을 완전한 직각으로: 가로변은 y 통일, 세로변은 x 통일 → 코너가 정확히 90°로 만남 */
function rectifyOutline(){ const n=S.outline.length; if(n<4)return;
  for(let i=0;i<n;i++){ const a=S.outline[i],b=S.outline[(i+1)%n];
    if(Math.abs(b.x-a.x)>=Math.abs(b.y-a.y)){ const y=Math.round((a.y+b.y)/2); a.y=y; b.y=y; } }
  for(let i=0;i<n;i++){ const a=S.outline[i],b=S.outline[(i+1)%n];
    if(Math.abs(b.y-a.y)>Math.abs(b.x-a.x)){ const x=Math.round((a.x+b.x)/2); a.x=x; b.x=x; } }
}
function snapToWalls(p,ignore){ let best=null;const R=Math.max(500,scale*12);
  const cons=(a,b)=>{ const r=distToSeg(p,a,b); if(r.d<R&&(!best||r.d<best.d))best={d:r.d,proj:r.proj}; };
  for(let i=0;i<S.outline.length;i++) cons(S.outline[i],S.outline[(i+1)%S.outline.length]);
  S.interiors.forEach((w,si)=>{ if(si===ignore)return; for(let j=0;j<w.pts.length-1;j++)cons(w.pts[j],w.pts[j+1]); });
  return best?best.proj:p; }

function convert(){
  const strokes=S.cur?S.strokes.concat([S.cur]):S.strokes.slice();
  if(!strokes.length){
    if(S.outline.length>=3){ setMode('edit'); centerContent(); fitContent(); return; }  // 새로 안 그렸으면 기존 도면 유지
    flash('먼저 벽 모양을 그려주세요'); return;
  }
  pushHist();
  S.outline=[]; S.outlineMM=[]; S.outlineTh=[]; S.interiors=[];   // ★ 기존 도면 교체(오버랩 방지)
  let outlineDone=false; const newIn=[];
  strokes.forEach(st=>{
    let sp=rdp(st,Math.max(150,scale*4));
    const closed=sp.length>=4 && dist(sp[0],sp[sp.length-1])<Math.max(600,scale*14) && chainLen(sp)>Math.max(1500,scale*30);
    if(closed) sp=sp.slice(0,-1);
    sp=dejunk(sp,closed);
    if(S.ortho) sp=snapChain(sp);          // 1) 각 벽 각도만 직각 스냅
    if(closed && !outlineDone){ S.outline=sp; outlineDone=true; }
    else newIn.push({pts:sp});
  });
  S.interiors=S.interiors.concat(newIn.map(o=>({pts:o.pts,mm:[],th:[]})));
  if(S.ortho) alignAll();                    // 2) 전체 벽 공통 격자 정렬(벽끼리 맞춤)
  cleanupOutline();                          // 3) 외곽 삐침/일직선 정리
  if(S.ortho){ rectifyOutline(); cleanupOutline(); rectifyOutline(); }  // 3b) 직각화 반복 수렴
  snapInteriorEnds();                        // 4) 내부벽 끝 연결 + 뜬 자투리 제거
  S.outlineMM=new Array(S.outline.length).fill(0); S.outlineTh=new Array(S.outline.length).fill(DEF_TH);
  S.interiors.forEach(w=>{ const seg=Math.max(0,w.pts.length-1);
    w.mm=new Array(seg).fill(0); w.th=new Array(seg).fill(DEF_TH); });
  S.strokes=[];S.cur=null;S.activeBox=null;S.selWall=null;
  centerContent();                           // ★ 용지 중앙 배치
  setMode('edit'); fitContent(); flash('정리됨 · 안 맞는 코너는 끌어서 맞추면 돼요');
}
/* 도면을 용지 중앙으로 이동 */
function centerContent(){ if(S.outline.length<3)return;
  const b=obounds(), tx=paperW()/2-(b.minx+b.maxx)/2, ty=paperH()/2-(b.miny+b.maxy)/2;
  S.outline.forEach(v=>{v.x+=tx;v.y+=ty;}); S.interiors.forEach(w=>w.pts.forEach(v=>{v.x+=tx;v.y+=ty;})); }
function chainLen(pts){ let s=0;for(let i=0;i<pts.length-1;i++)s+=dist(pts[i],pts[i+1]);return s; }

/* =========================================================================
   포인터
   ========================================================================= */
const pointers=new Map();
let startPan=null,moved=false,lastPinch=null,dragV=null,pend=null,lpTimer=null,lpFired=false;
svg.addEventListener('pointerdown',e=>{
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){ lastPinch=null;startPan=null;S.cur=null;dragV=null;cancelLP();pend=null;return; }
  if(pointers.size!==1)return; moved=false;
  if(S.mode==='sketch'){ S.cur=[toSvg(e.clientX,e.clientY)]; return; }
  const v=vertexAt(e.clientX,e.clientY); if(v){ dragV=v; pushHist(); return; }
  const hb=hitBox(e.clientX,e.clientY);
  if(hb){ pend={kind:'box',ref:hb,cx:e.clientX,cy:e.clientY}; lpFired=false;
    lpTimer=setTimeout(()=>{ lpFired=true; openNumpad(hb); },500); return; }
  const hw=hitWallRef(e.clientX,e.clientY);
  if(hw){ pend={kind:'wall',ref:hw,cx:e.clientX,cy:e.clientY}; return; }
  startPan={sx:e.clientX,sy:e.clientY,vbx:vb.x,vby:vb.y};
});
svg.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId))return; pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size>=2){ pinch(); return; }
  if(S.mode==='sketch'){ if(S.cur){ const p=toSvg(e.clientX,e.clientY); if(dist(p,S.cur[S.cur.length-1])>4*k()){ S.cur.push(p);render(); } } return; }
  if(pend){ if(Math.abs(e.clientX-pend.cx)+Math.abs(e.clientY-pend.cy)>8){ cancelLP(); startPan={sx:pend.cx,sy:pend.cy,vbx:vb.x,vby:vb.y}; pend=null; } }
  if(dragV){ moveVertex(dragV,toSvg(e.clientX,e.clientY)); render(); return; }
  if(startPan){ const dx=e.clientX-startPan.sx,dy=e.clientY-startPan.sy;
    if(Math.abs(dx)+Math.abs(dy)>7){ moved=true; const sc=k(); vb.x=startPan.vbx-dx*sc; vb.y=startPan.vby-dy*sc; apply();render(); } }
});
svg.addEventListener('pointerup',e=>{
  const single=pointers.size===1; pointers.delete(e.pointerId); if(pointers.size<2)lastPinch=null; if(!single)return;
  if(S.mode==='sketch'){ if(S.cur&&S.cur.length>=2){ pushHist(); S.strokes.push(S.cur); } S.cur=null;
    document.getElementById('btnConvert').disabled=!(S.strokes.length||S.outline.length); render(); return; }
  if(dragV){ finalizeDrag(dragV); dragV=null; render(); return; }
  if(pend){ cancelLP();
    if(!lpFired){ if(pend.kind==='box') toggleActiveBox(pend.ref); else selectWallTh(pend.ref); }
    pend=null; startPan=null; return; }
  if(!moved){ const r=roomAt(e.clientX,e.clientY);   // 빈 영역 탭 = 방 선택
    if(r){ closeRoom(); openRoom(S.rooms.indexOf(r)); } else { closeRoom(); if(S.selWall){S.selWall=null;closeTh();render();} } }
  startPan=null;
});
svg.addEventListener('pointercancel',e=>{ pointers.delete(e.pointerId); if(pointers.size<2)lastPinch=null; S.cur=null;dragV=null;cancelLP();pend=null; });
function cancelLP(){ if(lpTimer){clearTimeout(lpTimer);lpTimer=null;} }
function pinch(){ const ps=[...pointers.values()],d=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y),mid={x:(ps[0].x+ps[1].x)/2,y:(ps[0].y+ps[1].y)/2};
  if(lastPinch){ const f=lastPinch.d/d,p=toSvg(mid.x,mid.y); vb.w*=f;vb.h*=f;vb.x=p.x-(p.x-vb.x)*f;vb.y=p.y-(p.y-vb.y)*f;
    const sc=k();vb.x-=(mid.x-lastPinch.mid.x)*sc;vb.y-=(mid.y-lastPinch.mid.y)*sc;apply();render(); } lastPinch={d,mid}; }
function elAt(cx,cy,attr){ let e=document.elementFromPoint(cx,cy); while(e&&e!==svg){ if(e.dataset&&e.dataset[attr])return JSON.parse(e.dataset[attr]); e=e.parentNode; } return null; }
function hitBox(cx,cy){ return elAt(cx,cy,'box'); }
function hitWallRef(cx,cy){ return elAt(cx,cy,'wall'); }
function vertexAt(cx,cy){ const p=toSvg(cx,cy),R=22*k();
  for(let i=0;i<S.outline.length;i++) if(dist(p,S.outline[i])<R)return {t:'o',i};
  for(let s=0;s<S.interiors.length;s++){ const w=S.interiors[s]; for(let i=0;i<w.pts.length;i++) if(dist(p,w.pts[i])<R)return {t:'in',s,i}; } return null; }
function axisH(a,b){ return Math.abs(b.x-a.x)>=Math.abs(b.y-a.y); }
function moveVertex(v,np){
  if(v.t==='o'){ const arr=S.outline,n=arr.length,pr=(v.i-1+n)%n,nx=(v.i+1)%n;
    if(S.ortho){ const ph=axisH(arr[pr],arr[v.i]),nh=axisH(arr[v.i],arr[nx]); arr[v.i]={x:np.x,y:np.y};
      arr[pr]=ph?{x:arr[pr].x,y:np.y}:{x:np.x,y:arr[pr].y}; arr[nx]=nh?{x:arr[nx].x,y:np.y}:{x:np.x,y:arr[nx].y}; }
    else arr[v.i]={x:np.x,y:np.y};
  } else { const w=S.interiors[v.s],pts=w.pts,n=pts.length;
    if(S.ortho){ pts[v.i]={x:np.x,y:np.y};
      if(v.i>0){ const ph=axisH(pts[v.i-1],pts[v.i]); pts[v.i-1]=ph?{x:pts[v.i-1].x,y:np.y}:{x:np.x,y:pts[v.i-1].y}; }
      if(v.i<n-1){ const nh=axisH(pts[v.i],pts[v.i+1]); pts[v.i+1]=nh?{x:pts[v.i+1].x,y:np.y}:{x:np.x,y:pts[v.i+1].y}; } }
    else pts[v.i]={x:np.x,y:np.y}; } }
function finalizeDrag(v){ if(v.t==='in'){ const w=S.interiors[v.s];
    if(v.i===0)w.pts[0]=snapToWalls(w.pts[0],v.s); if(v.i===w.pts.length-1)w.pts[v.i]=snapToWalls(w.pts[v.i],v.s); } }

/* =========================================================================
   치수박스(실측) / 벽체(두께)
   ========================================================================= */
function toggleActiveBox(ref){ if(sameRef(S.activeBox,ref)) S.activeBox=null; else { S.activeBox=ref;
    if(!laser.connected) flash('초록=실측 대기 · 레이저 연결하거나 길게 눌러 직접 입력'); else flash('측정기 버튼을 누르세요'); } render(); }
function getMM(ref){ return segMM(ref); }
function applyMeasure(ref,mm){ pushHist(); applyGrid(ref,mm); S.activeBox=null; render(); }

const thbar=document.getElementById('thbar'),tbName=document.getElementById('tbName'),thInput=document.getElementById('thInput');
function selectWallTh(ref){ S.selWall=ref; S.activeBox=null; render();
  tbName.textContent=ref.t==='o'?'외벽 #'+(ref.w+1):'내부벽'; thInput.value=DEF_TH; thbar.classList.add('open'); syncZoombar(); }
function closeTh(){ thbar.classList.remove('open'); syncZoombar(); }
function syncZoombar(){ document.documentElement.style.setProperty('--dimh',
  (thbar.classList.contains('open')||document.getElementById('roombar').classList.contains('open'))?
   Math.max(thbar.offsetHeight,document.getElementById('roombar').offsetHeight)+'px':'0px'); }
document.getElementById('tbClose').onclick=()=>{ S.selWall=null; closeTh(); render(); };
thInput.oninput=()=>{ const v=parseInt(thInput.value); if(v>=40&&v<=500){ DEF_TH=v; render(); } };

/* 방 정보 바 */
const roombar=document.getElementById('roombar');
let curRoom=null;
function openRoom(idx){ const r=S.rooms[idx]; if(!r)return; curRoom=r; S.selWall=null; closeTh();
  document.getElementById('rbArea').textContent=roomAreaTxt(r);
  document.getElementById('rbName').value=r.meta.name||'';
  document.getElementById('rbFL').value=r.meta.fl; document.getElementById('rbCH').value=r.meta.ch;
  roombar.classList.add('open'); syncZoombar(); }
function closeRoom(){ roombar.classList.remove('open'); curRoom=null; syncZoombar(); }
document.getElementById('rbClose').onclick=closeRoom;
document.getElementById('rbName').oninput=()=>{ if(curRoom){ curRoom.meta.name=document.getElementById('rbName').value; render(); } };
document.getElementById('rbFL').oninput=()=>{ if(curRoom){ curRoom.meta.fl=parseInt(document.getElementById('rbFL').value)||0; render(); } };
document.getElementById('rbCH').oninput=()=>{ if(curRoom){ curRoom.meta.ch=parseInt(document.getElementById('rbCH').value)||0; render(); } };
document.getElementById('btnDoor').onclick=addDoor;

/* 숫자패드 */
const numpad=document.getElementById('numpad'),npVal=document.getElementById('npVal'),npHead=document.getElementById('npHead'),npGrid=document.getElementById('npGrid');
let npBuf='',npRef=null;
['1','2','3','4','5','6','7','8','9','⌫','0','✓'].forEach(kk=>{ const b=document.createElement('button');
  b.textContent=kk; if(kk==='⌫')b.className='del'; if(kk==='✓')b.className='ok'; b.onclick=()=>npKey(kk); npGrid.appendChild(b); });
function openNumpad(ref){ npRef=ref; S.activeBox=ref; render(); npBuf=String(getMM(ref)||'');
  npHead.textContent=(ref.t==='gx'?'가로 구간':'세로 구간')+' 내경(mm)'; npVal.textContent=npBuf||'0'; numpad.classList.add('open'); }
function closeNumpad(){ numpad.classList.remove('open'); npRef=null; }
function npKey(kk){ if(kk==='⌫')npBuf=npBuf.slice(0,-1); else if(kk==='✓'){ applyNum(); return; } else if(npBuf.length<6)npBuf+=kk; npVal.textContent=npBuf||'0'; }
function applyNum(){ if(!npRef)return; const mm=parseInt(npBuf)||0; applyMeasure(npRef,mm); closeNumpad(); flash('내경 '+mm+'mm 적용'); }

/* =========================================================================
   줌 / 맞춤 / 툴바
   ========================================================================= */
function zoomAt(cx,cy,f){ const p=toSvg(cx,cy);vb.w*=f;vb.h*=f;vb.x=p.x-(p.x-vb.x)*f;vb.y=p.y-(p.y-vb.y)*f;apply();render(); }
svg.addEventListener('wheel',e=>{ e.preventDefault(); zoomAt(e.clientX,e.clientY,e.deltaY>0?1.12:0.9); },{passive:false});
document.getElementById('zIn').onclick=()=>zoomAt(svg.clientWidth/2,svg.clientHeight/2,0.82);
document.getElementById('zOut').onclick=()=>zoomAt(svg.clientWidth/2,svg.clientHeight/2,1.22);
document.getElementById('zFit').onclick=fitPaper;
function fitPaper(){ const W=paperW(),H=paperH(),pad=Math.max(W,H)*0.06;
  const w=W+pad*2,h=H+pad*2,ar=svg.clientWidth/svg.clientHeight; let VW=w,VH=h;
  if(w/h>ar)VH=w/ar; else VW=h*ar; vb={x:-pad-(VW-w)/2,y:-pad-(VH-h)/2,w:VW,h:VH}; apply();render(); }
function contentPts(){ let a=[...S.outline]; S.interiors.forEach(w=>a=a.concat(w.pts)); S.strokes.forEach(s=>a=a.concat(s)); if(S.cur)a=a.concat(S.cur); return a; }
function fitContent(){ const pts=contentPts(); if(pts.length<2){ fitPaper(); return; }
  let a=1e9,b=1e9,c=-1e9,d=-1e9; pts.forEach(p=>{a=Math.min(a,p.x);b=Math.min(b,p.y);c=Math.max(c,p.x);d=Math.max(d,p.y);});
  const pad=Math.max(c-a,d-b)*0.18+DEF_TH*2; a-=pad;b-=pad;c+=pad;d+=pad;
  const w=c-a,h=d-b,ar=svg.clientWidth/svg.clientHeight;let W=w,H=h; if(w/h>ar)H=w/ar;else W=h*ar;
  vb={x:a-(W-w)/2,y:b-(H-h)/2,w:W,h:H}; apply();render(); }

function setMode(m){ S.mode=m;
  document.getElementById('btnSketch').classList.toggle('primary',m==='sketch');
  document.getElementById('btnConvert').disabled=!(m==='sketch'&&(S.strokes.length||S.cur||S.outline.length));
  if(m==='sketch'){ S.activeBox=null;S.selWall=null;closeTh();closeNumpad(); } render(); }
document.getElementById('btnSketch').onclick=()=>{ setMode('sketch'); flash('벽 모양을 손으로 슥 · 외곽은 닫고 칸막이는 열어서'); };
document.getElementById('btnConvert').onclick=convert;
document.getElementById('btnOrtho').onclick=()=>{ S.ortho=!S.ortho; const b=document.getElementById('btnOrtho');
  b.classList.toggle('on',S.ortho); b.textContent=S.ortho?'⊾ 30°':'⊾ OFF'; flash(S.ortho?'30° 이내 직각보정 켜짐':'보정 꺼짐'); };
document.getElementById('btnUndo').onclick=undo;
document.getElementById('btnClear').onclick=()=>{ if(!confirm('전체 지울까요?'))return;
  pushHist(); S.outline=[];S.outlineMM=[];S.outlineTh=[];S.interiors=[];S.strokes=[];S.cur=null;S.activeBox=null;S.selWall=null;
  S.doors=[];S.roomMeta=[];S.rooms=[]; closeTh();closeNumpad();closeRoom(); setMode('sketch'); fitPaper(); };
document.getElementById('btnExport').onclick=exportDXF;

/* 파일 저장 / 불러오기 (.json) */
function saveFile(){
  const data={app:'ballo',v:2,paperSize,scale,outline:S.outline,outlineTh:S.outlineTh,
    interiors:S.interiors.map(w=>({pts:w.pts})), doors:S.doors, roomMeta:S.roomMeta};
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url; a.download='ballo_도면_'+Date.now()+'.json'; a.click(); URL.revokeObjectURL(url); flash('저장됨');
}
function loadFile(file){ const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); pushHist();
    paperSize=(d.paperSize==='A4')?'A4':'A3'; scale=SCALES.includes(+d.scale)?+d.scale:60;
    S.outline=d.outline||[]; S.outlineTh=d.outlineTh||S.outline.map(()=>DEF_TH);
    S.outlineMM=S.outline.map(()=>0);
    S.interiors=(d.interiors||[]).map(w=>({pts:w.pts,mm:new Array(Math.max(0,w.pts.length-1)).fill(0),th:new Array(Math.max(0,w.pts.length-1)).fill(DEF_TH)}));
    S.doors=d.doors||[]; S.roomMeta=d.roomMeta||[]; S.rooms=[];
    S.strokes=[];S.cur=null;S.activeBox=null;S.selWall=null;
    document.getElementById('selSize').value=paperSize; document.getElementById('selScale').value=scale;
    setMode('edit'); fitContent(); flash('불러왔어요');
  }catch(e){ flash('파일을 읽을 수 없어요'); } };
  r.readAsText(file);
}
document.getElementById('btnSave').onclick=()=>{ if(S.outline.length<3){ flash('저장할 도면이 없어요'); return; } saveFile(); };
document.getElementById('btnOpen').onclick=()=>document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange=e=>{ if(e.target.files[0])loadFile(e.target.files[0]); e.target.value=''; };

const selSize=document.getElementById('selSize'),selScale=document.getElementById('selScale');
SCALES.forEach(s=>{ const o=document.createElement('option'); o.value=s; o.textContent='1:'+s; if(s===60)o.selected=true; selScale.appendChild(o); });
selSize.onchange=()=>{ paperSize=selSize.value; centerContent(); fitPaper(); flash('용지 '+paperSize); };
selScale.onchange=()=>{ scale=+selScale.value; centerContent(); fitPaper(); flash('스케일 1:'+scale); };

const hintEl=document.getElementById('hint'); let flashT=null;
function updateHint(){ let m;
  if(S.mode==='sketch') m=(S.strokes.length||S.cur)?'더 그리거나 <b>→ 변환</b> · 잘못 그렸으면 <b>↶</b>':'용지 위에 벽 모양을 손으로 <b>슥</b>';
  else m='치수박스 탭=실측(초록) · 길게=입력 · 벽 탭=두께 · 코너 끌기=수정';
  hintEl.innerHTML=m; }
function flash(t){ hintEl.innerHTML=t; clearTimeout(flashT); flashT=setTimeout(updateHint,2000); }

/* =========================================================================
   DXF (내경 반영: 벽 중심선 + 안쪽선)
   ========================================================================= */
function exportDXF(){ if(S.outline.length<3){ flash('먼저 평면도를 만들어주세요'); return; }
  const all=contentPts(),minx=Math.min(...all.map(p=>p.x)),maxy=Math.max(...all.map(p=>p.y));
  const X=v=>+(v.x-minx).toFixed(1), Y=v=>+(maxy-v.y).toFixed(1);
  const lines=[], texts=[];
  const pushPoly=(pts,layer,closed)=>{ const lim=closed?pts.length:pts.length-1;
    for(let i=0;i<lim;i++){ const a=pts[i],b=pts[(i+1)%pts.length]; lines.push({layer,x1:X(a),y1:Y(a),x2:X(b),y2:Y(b)}); } };
  pushPoly(offsetPoly(S.outline,DEF_TH/2),'WALL',true);
  pushPoly(offsetPoly(S.outline,-DEF_TH/2),'WALL',true);
  S.interiors.forEach(w=>{ if(w.pts.length<2)return; const c=trimInner(w.pts);
    pushPoly(offsetOpen(c,DEF_TH/2),'INNER',false); pushPoly(offsetOpen(c,-DEF_TH/2),'INNER',false); });
  // 치수 텍스트 (구간 내경)
  const xs=gridX(),ys=gridY(),b=obounds();
  for(let i=0;i<xs.length-1;i++){ const v=Math.round(xs[i+1]-xs[i]-DEF_TH); if(v>0)
    texts.push({x:(X({x:xs[i]})+X({x:xs[i+1]}))/2,y:Y({y:b.miny})+400,s:''+v}); }
  for(let i=0;i<ys.length-1;i++){ const v=Math.round(ys[i+1]-ys[i]-DEF_TH); if(v>0)
    texts.push({x:X({x:b.minx})-800,y:(Y({y:ys[i]})+Y({y:ys[i+1]}))/2,s:''+v}); }
  // ── 유효한 R12 DXF 조립 ──
  let d=''; const g=(c,v)=>{ d+=c+'\n'+v+'\n'; };
  g(0,'SECTION');g(2,'HEADER');g(9,'$ACADVER');g(1,'AC1009');g(9,'$INSUNITS');g(70,4);g(0,'ENDSEC');
  g(0,'SECTION');g(2,'TABLES');g(0,'TABLE');g(2,'LAYER');g(70,4);
  [['0',7],['WALL',7],['INNER',8],['DIM',3]].forEach(([nm,col])=>{ g(0,'LAYER');g(2,nm);g(70,0);g(62,col);g(6,'CONTINUOUS'); });
  g(0,'ENDTAB');g(0,'ENDSEC');
  g(0,'SECTION');g(2,'ENTITIES');
  lines.forEach(L=>{ g(0,'LINE');g(8,L.layer);g(10,L.x1);g(20,L.y1);g(30,0);g(11,L.x2);g(21,L.y2);g(31,0); });
  texts.forEach(T=>{ g(0,'TEXT');g(8,'DIM');g(10,+T.x.toFixed(1));g(20,+T.y.toFixed(1));g(30,0);g(40,250);g(1,T.s); });
  g(0,'ENDSEC');g(0,'EOF');
  const blob=new Blob([d],{type:'application/dxf'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='ballo_도면_'+Date.now()+'.dxf';a.click();URL.revokeObjectURL(url);flash('DXF 저장됨');
}

/* =========================================================================
   레이저 (Bosch GLM 50-27 CG) — 활성 치수박스에 입력
   ========================================================================= */
const BOSCH={ svc:'02a6c0d0-0451-4000-b000-fb3210111989',char:'02a6c0d1-0451-4000-b000-fb3210111989',
  enableCmd:new Uint8Array([0xc0,0x55,0x02,0x01,0x00,0x1a]),pktPrefix:[0xc0,0x55,0x10,0x06],
  parse(dv){ const b=new Uint8Array(dv.buffer); if(this.pktPrefix.every((x,i)=>b[i]===x)&&b.length>=11)return Math.round(dv.getFloat32(7,true)*1000); return null; } };
const laser={device:null,char:null,connected:false};
const pop=document.getElementById('laserPop');
pop.innerHTML=`<h4>📡 레이저 측정기 <span style="font-weight:600;color:var(--muted);font-size:11px">Bosch GLM 50-27 CG</span></h4>
  <div class="st off" id="lsSt">연결 안됨</div>
  <button class="btn primary" id="lsConn" style="width:100%;justify-content:center">기기 검색 · 연결</button>
  <div class="val" id="lsVal">— <small>mm</small></div>
  <div class="switch" style="margin-top:4px"><input type="checkbox" id="lsAuto" checked> 측정값을 초록 치수박스에 자동 입력</div>
  <div class="log" id="lsLog">안드로이드 Chrome · https 에서 연결하세요.\n</div>`;
const $=id=>pop.querySelector('#'+id); let autofill=true;
$('lsAuto').onchange=e=>autofill=e.target.checked;
function lg(t){ const l=$('lsLog'); l.textContent+=t+'\n'; l.scrollTop=l.scrollHeight; }
function stat(c,t){ const s=$('lsSt');s.className='st '+c;s.textContent=t;
  $('lsConn').textContent=c==='on'?'연결 해제':'기기 검색 · 연결'; document.getElementById('btnLaser').classList.toggle('on',c==='on'); }
document.getElementById('btnLaser').onclick=()=>pop.classList.toggle('open');
$('lsConn').onclick=connect;
async function connect(){ if(!navigator.bluetooth){ stat('err','Web Bluetooth 미지원'); lg('⚠ 안드로이드 Chrome + https 필요'); return; }
  if(laser.device&&laser.device.gatt.connected){ laser.device.gatt.disconnect(); return; }
  try{ stat('off','기기 선택 대기…'); lg('▶ 기기 검색…');
    laser.device=await navigator.bluetooth.requestDevice({filters:[{services:[BOSCH.svc]}],optionalServices:[BOSCH.svc]});
    lg('· 선택: '+(laser.device.name||'GLM'));
    laser.device.addEventListener('gattserverdisconnected',()=>{laser.connected=false;stat('off','연결 끊김');lg('· 연결 끊김');});
    const server=await laser.device.gatt.connect(),svc=await server.getPrimaryService(BOSCH.svc);
    laser.char=await svc.getCharacteristic(BOSCH.char); await laser.char.startNotifications();
    laser.char.addEventListener('characteristicvaluechanged',e=>onRaw(e.target.value));
    await laser.char.writeValueWithResponse(BOSCH.enableCmd);
    laser.connected=true; stat('on','연결됨 · '+(laser.device.name||'GLM')); lg('✔ 준비 완료 — 치수박스 탭 후 측정');
    setTimeout(()=>pop.classList.remove('open'),900);   // 연결되면 페어링 화면 닫기
  }catch(err){ if(err.name==='NotFoundError'){stat('off','선택 취소');lg('· 취소');}else{stat('err','연결 실패');lg('✖ '+err.message);} } }
function onRaw(dv){ const hex=[...new Uint8Array(dv.buffer)].map(b=>b.toString(16).padStart(2,'0')).join(' ');lg('◀ '+hex);
  let mm=null;try{mm=BOSCH.parse(dv);}catch(e){}
  if(mm!=null&&isFinite(mm)){ $('lsVal').innerHTML=mm+' <small>mm</small>';lg('  → '+mm+' mm');
    if(autofill&&S.activeBox){ applyMeasure(S.activeBox,mm); flash('→ '+mm+'mm 적용'); }
    else if(autofill) flash('먼저 치수박스를 탭해 초록으로 만드세요'); } }

/* ---------- 시작 ---------- */
setMode('sketch'); fitPaper(); syncZoombar();
window.addEventListener('resize',()=>{ syncZoombar(); render(); });
</script>
